<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>스탠바이</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;800;900&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="common.js"></script>
<style>
:root{--bg:#000;--pane:#151517;--pane2:#1c1c1f;--ink:#f3f3f5;--sub:#8b8b93;--acc:#ff9f43;--acc2:#ffd6a8}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Pretendard Variable",sans-serif}
.l{position:absolute;left:64px;top:0;bottom:0;width:820px;display:flex;flex-direction:column;justify-content:center}
.t{font-family:Nunito;font-weight:900;font-size:320px;line-height:.86;letter-spacing:-.035em;font-variant-numeric:tabular-nums;display:flex}
.t .m{color:var(--acc2)}
.t .c{color:#3a3a40;margin:0 4px}
.dt{display:flex;align-items:center;gap:18px;font-size:36px;font-weight:600;color:var(--sub);margin:28px 0 0 14px}
.dt b{color:var(--ink);font-weight:700}
.tm{margin:34px 0 0 10px;align-self:flex-start;display:flex;align-items:center;gap:18px;background:var(--pane);border-radius:999px;padding:12px 30px 12px 14px}
.tm svg{width:54px;height:54px}
.tm b{font-family:Nunito;font-weight:800;font-size:46px;font-variant-numeric:tabular-nums}
.tm span{font-size:20px;color:var(--sub)}
.r{position:absolute;right:56px;top:56px;bottom:56px;width:470px;display:grid;grid-template-rows:auto 1fr auto;gap:18px}
.p{background:var(--pane);border-radius:28px;padding:24px 28px}
.p h3{font-size:17px;font-weight:600;color:var(--sub);margin-bottom:12px}
.wx{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px}
.wx .k{width:64px;height:64px}
.wx b{font-family:Nunito;font-weight:300;font-size:80px;line-height:1}
.wx span{font-size:21px;color:var(--sub);line-height:1.5}
.wx .flag{display:flex;align-items:center;gap:8px;background:#2a2116;color:var(--acc);border-radius:999px;padding:6px 14px 6px 10px;font-size:17px;font-weight:600}
.wx .flag svg{width:22px;height:22px}
.ev{display:grid;grid-template-columns:6px 84px 1fr;gap:14px;align-items:center;font-size:25px;padding:9px 0}
.ev i{width:6px;height:30px;border-radius:3px;background:#3a3a40}
.ev .tt{font-family:Nunito;font-weight:800;font-size:25px;color:var(--sub)}
.ev.next i{background:var(--acc)}.ev.next .tt{color:var(--acc)}
.ev.later i{background:#5d7bff}
.ev.past{color:#505056}
.wk{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin-top:16px}
.wk div{background:var(--pane2);border-radius:12px;padding:8px 0;text-align:center;font-size:15px;color:var(--sub)}
.wk div b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.wk div u{display:block;width:6px;height:6px;border-radius:50%;margin:0 auto;background:var(--acc);text-decoration:none}
.wk div u.no{background:transparent}
.wk .sun b{color:#ff6b6b}
#mm>div{font-size:23px;padding:5px 0;display:flex;gap:12px;align-items:center}
#mm>div::before{content:"";width:16px;height:16px;border-radius:50%;border:2px solid #4a4a52;flex:none}
.dot{position:absolute;right:22px;bottom:20px;width:7px;height:7px;border-radius:50%;background:#2f5d3a}
</style></head><body>
<div class="l">
  <div class="t"><span>10</span><span class="c">:</span><span class="m">09</span></div>
  <div class="dt"><b>11월 11일 수요일</b>· 다음 12:30 점심 약속</div>
  <div class="tm"><svg viewBox="0 0 54 54"><circle cx="27" cy="27" r="22" fill="none" stroke="#2c2c31" stroke-width="6"/><circle cx="27" cy="27" r="22" fill="none" stroke="#ff9f43" stroke-width="6" stroke-linecap="round" stroke-dasharray="138.2" stroke-dashoffset="52" transform="rotate(-90 27 27)"/></svg><b>3:24</b><span>타이머</span></div>
</div>
<div class="r">
  <div class="p wx"><svg class="k" viewBox="0 0 64 64" fill="none" stroke="#c9c9d1" stroke-width="2.4" stroke-linecap="round"><path d="M20 46h26a10 10 0 0 0 0-20 14 14 0 0 0-27-3A11 11 0 0 0 20 46z"/></svg><div><b>8°</b></div><div style="text-align:right"><span>흐림 · 마포구<br>12° / 3°</span><div class="flag" id="fl"></div></div></div>
  <div class="p"><h3>오늘</h3><div id="ev"></div><div class="wk" id="wk"></div></div>
  <div class="p memo"><h3>메모</h3><div id="mm"></div></div>
</div>
<i class="dot"></i>
<script>
const S=SAMPLE;
document.getElementById('fl').innerHTML=ICON.umbrella+'우산';
document.getElementById('ev').innerHTML=S.today.map(e=>`<div class="ev ${e.st}"><i></i><span class="tt">${e.t}</span><span>${e.n}</span></div>`).join('');
document.getElementById('wk').innerHTML=S.week.map(w=>`<div class="${w[2]||''}"><b>${w[0]}</b><u class="${w[1]?'':'no'}"></u></div>`).join('');
document.getElementById('mm').innerHTML=S.memos.map(m=>`<div>${m}</div>`).join('');
</script></body></html>
