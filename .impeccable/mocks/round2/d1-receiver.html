<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>리시버</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="common.js"></script>
<style>
@font-face{font-family:DSEG7;src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Bold.woff2) format("woff2")}
@font-face{font-family:DSEG7L;src:url(https://cdn.jsdelivr.net/npm/dseg@0.46.0/fonts/DSEG7-Classic/DSEG7Classic-Light.woff2) format("woff2")}
:root{--room:#0a0908;--amber:#ffb02a;--amber2:#d98a22;--ghost:rgba(255,176,42,.065);--engrave:#958e84}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--room);font-family:"Pretendard Variable",sans-serif}
.unit{position:absolute;inset:34px 30px;display:grid;grid-template-columns:52px minmax(0,1fr) 52px;border-radius:12px;overflow:hidden;box-shadow:0 40px 80px rgba(0,0,0,.7)}
.cheek{background:linear-gradient(90deg,#2e1a0e,#5a3520 30%,#6b4128 55%,#4a2b18 80%,#2a170c)}
.face{position:relative;background:repeating-linear-gradient(0deg,rgba(255,255,255,.012) 0 1px,transparent 1px 3px),linear-gradient(180deg,#2a2826,#1c1b1a 50%,#141312);padding:40px 46px 28px;display:grid;grid-template-rows:auto 1fr auto;gap:24px}
.face::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:rgba(255,255,255,.12)}
.glass{position:relative;background:linear-gradient(180deg,#0b0907,#060504);border-radius:6px;box-shadow:inset 0 3px 18px rgba(0,0,0,.95),0 1px 0 rgba(255,255,255,.07);padding:26px 40px 22px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:50px}
.glass::after{content:"";position:absolute;inset:0;border-radius:6px;background:linear-gradient(160deg,rgba(255,255,255,.05),transparent 35%);pointer-events:none}
.vfd{color:var(--amber);text-shadow:0 0 14px rgba(255,160,30,.5),0 0 2px rgba(255,200,110,.9)}
.time{position:relative;font-family:DSEG7;font-size:196px;line-height:1}
.time .g{position:absolute;left:0;top:0;color:var(--ghost);text-shadow:none}
.time sup{font-size:64px;vertical-align:top;margin-left:12px;position:relative}
.time sup .g{position:absolute}
.side{display:flex;flex-direction:column;justify-content:space-between;padding:6px 0}
.d{font-family:DSEG7;font-size:44px;display:flex;align-items:center;gap:14px}
.d small{font-family:"Pretendard Variable";font-weight:700;font-size:32px}
.w{font-size:30px;font-weight:600;display:flex;align-items:center;gap:12px}
.w svg{width:34px;height:34px}
.w span{font-weight:400;font-size:21px;color:var(--amber2);text-shadow:none}
.tm{display:flex;align-items:center;gap:14px;font-size:20px;font-weight:600;letter-spacing:.1em}
.tm b{font-family:DSEG7L;font-size:40px;letter-spacing:0}
.tm i{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 8px var(--amber)}
.mid{display:grid;grid-template-columns:1.3fr 1fr;gap:26px;min-height:0}
.win{background:#080706;border-radius:5px;box-shadow:inset 0 2px 12px rgba(0,0,0,.9),0 1px 0 rgba(255,255,255,.05);padding:16px 26px}
.lab{font-size:14px;font-weight:600;color:var(--engrave);letter-spacing:.18em;margin-bottom:10px}
.ev{display:grid;grid-template-columns:118px 1fr;font-size:26px;padding:6px 0;align-items:baseline}
.ev .t{font-family:DSEG7;font-size:24px}
.ev.past{color:#4a3618;text-shadow:none}
.week{display:flex;gap:20px;margin-top:12px;padding-top:12px;border-top:1px solid #1d1a16}
.week div{display:flex;flex-direction:column;align-items:center;gap:7px;font-size:15px;color:var(--engrave)}
.lamp{width:11px;height:11px;border-radius:50%;background:#261d12;box-shadow:inset 0 1px 2px rgba(0,0,0,.8)}
.lamp.on{background:var(--amber);box-shadow:0 0 10px rgba(255,160,30,.75)}
#mm div{font-size:25px;padding:5px 0}
.presets{display:grid;grid-template-columns:repeat(9,1fr) 1.15fr;gap:12px}
.key{display:flex;flex-direction:column;align-items:center;gap:7px}
.key b{width:100%;height:44px;border-radius:3px;background:linear-gradient(180deg,#3c3a37,#272523 60%,#211f1d);box-shadow:0 3px 0 #0b0a09,0 4px 8px rgba(0,0,0,.6),inset 0 1px 0 rgba(255,255,255,.09);display:grid;place-items:center;color:#d6cfc3;font-size:19px;font-weight:700}
.key span{font-size:14px;color:var(--engrave)}
.key.home b{background:linear-gradient(180deg,#6a4327,#47291a);color:#f2dcbc}
.dot{position:absolute;right:16px;bottom:10px;width:7px;height:7px;border-radius:50%;background:#5f7d4f}
</style></head><body>
<div class="unit"><div class="cheek"></div>
<div class="face">
  <div class="glass">
    <div class="time vfd"><span class="g">88:88</span>10:09<sup><span class="g">88</span>32</sup></div>
    <div class="side vfd">
      <div class="d">11.11<small>수</small></div>
      <div class="w"><span id="ic" style="color:var(--amber);font-size:0"></span>흐림 8°<span>12° / 3°</span></div>
      <div class="tm"><i></i>타이머<b>3:24</b></div>
    </div>
  </div>
  <div class="mid">
    <div class="win"><div class="lab">오늘</div><div id="ev"></div><div class="week" id="wk"></div></div>
    <div class="win memo"><div class="lab">메모</div><div id="mm"></div></div>
  </div>
  <div class="presets" id="ps"></div>
</div><div class="cheek"></div></div>
<i class="dot"></i>
<script>
const S=SAMPLE;
document.getElementById('ic').innerHTML=ICON.umbrella;
document.getElementById('ev').innerHTML=S.today.map(e=>`<div class="ev vfd ${e.st}"><span class="t">${e.t}</span><span>${e.n}</span></div>`).join('');
document.getElementById('wk').innerHTML=S.week.map(w=>`<div><i class="lamp ${w[1]?'on':''}"></i>${w[0]}</div>`).join('');
document.getElementById('mm').innerHTML=S.memos.map(m=>`<div class="vfd">${m}</div>`).join('');
document.getElementById('ps').innerHTML=[...Array(9)].map((_,i)=>`<div class="key"><b>${i+1}</b><span>${S.slots[i]||'—'}</span></div>`).join('')+'<div class="key home"><b>0</b><span>시계</span></div>';
</script></body></html>
