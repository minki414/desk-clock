<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><title>바우하우스</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jost:wght@200;300;400;500&display=swap">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css">
<script src="common.js"></script>
<style>
:root{--wall:#d9d6d0;--face:#fdfdfb;--ink:#161616;--sub:#5e5b55;--yel:#f2b200}
*{box-sizing:border-box;margin:0}
html,body{width:1440px;height:900px;overflow:hidden;background:var(--wall);color:var(--ink);font-family:"Pretendard Variable",sans-serif}
.grid{display:grid;grid-template-columns:330px 1fr 330px;height:900px;padding:64px 64px}
.col{display:flex;flex-direction:column;gap:34px;padding-top:6px}
.mid{display:flex;flex-direction:column;align-items:center}
svg.face{width:640px;height:640px;filter:drop-shadow(0 26px 40px rgba(0,0,0,.18)) drop-shadow(0 3px 4px rgba(0,0,0,.18))}
.timer{margin-top:34px;font-family:Jost;font-weight:300;font-size:64px;letter-spacing:.02em;display:flex;align-items:center;gap:18px;font-variant-numeric:tabular-nums}
.timer::before{content:"";width:14px;height:14px;border-radius:50%;background:var(--yel)}
.big{font-family:Jost;font-weight:200;font-size:120px;line-height:.9;letter-spacing:-.03em}
.lab{font-size:15px;font-weight:600;color:var(--sub);border-top:2px solid var(--ink);padding-top:10px;margin-bottom:8px}
.dt{font-size:30px;font-weight:600;line-height:1.3}
.wx{display:flex;align-items:flex-start;gap:12px}
.wx .t{font-family:Jost;font-weight:300;font-size:84px;line-height:.9}
.wx .d{font-size:20px;color:var(--sub);line-height:1.45;padding-top:6px}
.wx svg{width:30px;height:30px;color:var(--ink)}
.ev{display:grid;grid-template-columns:76px 1fr;font-size:24px;padding:5px 0;align-items:baseline}
.ev .t{font-family:Jost;font-weight:400;font-size:24px}
.ev.past{color:#9b978f}.ev.next .t{background:var(--yel);padding:0 4px;margin-left:-4px;width:max-content}
#wk div{display:grid;grid-template-columns:40px 1fr;font-size:20px;padding:3px 0;color:var(--sub)}
#wk b{color:var(--ink);font-weight:600}
.memo li{list-style:none;font-size:22px;padding:3px 0}.memo ul{padding:0}
.dot{position:absolute;right:22px;bottom:20px;width:7px;height:7px;border-radius:50%;background:#8fa38a}
</style></head><body>
<div class="grid">
  <div class="col">
    <div><div class="lab">오늘</div><div class="dt">11월 11일<br>수요일</div></div>
    <div><div class="lab">날씨 · 마포구</div><div class="wx"><span class="t">8°</span><span class="d">흐림<br>12° / 3°</span><span id="ic"></span></div></div>
    <div class="memo"><div class="lab">메모</div><ul id="mm"></ul></div>
  </div>
  <div class="mid"><svg class="face" id="f" viewBox="-300 -300 600 600"></svg><div class="timer">3:24</div></div>
  <div class="col">
    <div><div class="lab">일정</div><div id="ev"></div></div>
    <div class="wk"><div class="lab" style="display:block">이번 주</div><div id="wk"></div></div>
  </div>
</div>
<i class="dot"></i>
<script>
const S=SAMPLE,f=document.getElementById('f');
document.getElementById('ic').innerHTML=ICON.umbrella;
document.getElementById('ev').innerHTML=S.today.map(e=>`<div class="ev ${e.st}"><span class="t">${e.t}</span><span>${e.n}</span></div>`).join('');
document.getElementById('wk').innerHTML=S.week.filter(w=>w[1]).map(w=>`<div><b>${w[0]}</b>${w[1]}</div>`).join('');
document.getElementById('mm').innerHTML=S.memos.map(m=>`<li>${m}</li>`).join('');
svgEl(f,'circle',{r:298,fill:'#2a2a2a'});svgEl(f,'circle',{r:290,fill:'var(--face)'});
const defs=svgEl(f,'defs',{});defs.innerHTML='<radialGradient id="dome" cx=".35" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".35"/><stop offset=".55" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".06"/></radialGradient>';
for(let i=0;i<60;i++){const h=i%5==0;const[x1,y1]=polar(h?258:266,i*6),[x2,y2]=polar(278,i*6);svgEl(f,'line',{x1,y1,x2,y2,stroke:'#161616','stroke-width':h?3:1})}
for(let i=1;i<=12;i++){const[x,y]=polar(222,i*30);const t=svgEl(f,'text',{x,y:y+17,'text-anchor':'middle','font-family':'Jost','font-size':48,'font-weight':300,fill:'#161616'});t.textContent=i}
const A=angles();
svgEl(f,'rect',{x:-6,y:-150,width:12,height:172,rx:2,fill:'#161616',transform:`rotate(${A.h})`});
svgEl(f,'rect',{x:-4.5,y:-246,width:9,height:268,rx:2,fill:'#161616',transform:`rotate(${A.m})`});
svgEl(f,'line',{x1:0,y1:48,x2:0,y2:-262,stroke:'#f2b200','stroke-width':3,transform:`rotate(${A.s})`});
svgEl(f,'circle',{r:10,fill:'#f2b200'});svgEl(f,'circle',{r:3,fill:'#161616'});
svgEl(f,'circle',{r:290,fill:'url(#dome)'});
</script></body></html>
